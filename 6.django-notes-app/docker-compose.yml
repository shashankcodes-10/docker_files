services:
   frontend:
     container_name: notes-app-front
     build:
       context: ./frontend
     ports:
      - "80:80"
     healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]   
       retries: 5
       interval: 10s
       timeout: 5s
       start_period: 30s
     depends_on:
       backend:
        condition: service_healthy  
     networks:
      - notes-app  

   backend:
     container_name: notes-app-back
     build:
      context: ./backend
     env_file:
      - ./.env
     depends_on:
      db:
       condition: service_healthy
     ports:
      - "8000:8000"
     networks:
      - notes-app
     healthcheck:
       test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1"]
       retries: 5
       interval: 10s
       timeout: 5s
       start_period: 30s

   db:
    container_name: db_cont
    image: mysql:5.7
    env_file:
      - ./.env
    ports:
     - "3306:3306"
    networks:
     - notes-app
    volumes:
    - notes-vol:/var/lib/mysql    
    healthcheck:
     test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
     retries: 5
     interval: 10s
     timeout: 5s
     start_period: 30s    

networks:
  notes-app:

volumes:
  notes-vol:             