services:
   frontend:
     container_name: skillpulse-frontend
     build:
      context: ./frontend
     networks:
      - skillpulse-net 
     ports:
      - "80:80"
     depends_on:
      - backend 

   backend:
     container_name: skillpulse-backend
     build:
       context: ./backend
     networks:
      - skillpulse-net
     environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
     ports:
      - "8000:8000"
     depends_on:
      - mysql 

   mysql:
    container_name: mysql
    image: mysql:5.7
    networks:
     - skillpulse-net
    volumes:
     - ./mysql:/docker-entrypoint-initdb.d:ro
     - skillpulse:/var/lib/mysql
    environment:
     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
     MYSQL_DATABASE: ${MYSQL_DATABASE}
     MYSQL_USER: ${MYSQL_USER}
     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
     - "3306:3306"
    healthcheck:
     test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p $$MYSQL_ROOT_PASSWORD"]  
     interval: 10s
     retries: 5
     timeout: 5s
     start_period: 30s


networks:
   skillpulse-net:

volumes:
   skillpulse:
